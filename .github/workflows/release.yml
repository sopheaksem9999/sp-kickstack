name: Release Desktop App

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/release.yml'
      - 'packages/desktop/**'
      - 'scripts/bundle-desktop-server.mjs'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (leave blank to auto-detect from package.json)'
        required: false
        default: ''
      force:
        description: 'Force build even if tag already exists on remote'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Version & Tag
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.check_tag.outputs.should_release }}
      tag_name: ${{ steps.check_tag.outputs.tag_name }}
      version: ${{ steps.check_tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check version and tag
        id: check_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          
          # Check if tag exists on remote
          REMOTE_TAG_SHA=$(git ls-remote --tags origin "refs/tags/${TAG}" | head -n 1 | awk '{print $1}')
          HEAD_SHA=$(git rev-parse HEAD)
          IS_MANUAL="${{ github.event_name == 'workflow_dispatch' }}"
          FORCE="${{ inputs.force }}"
          
          if [ -n "$REMOTE_TAG_SHA" ] && [ "$REMOTE_TAG_SHA" != "$HEAD_SHA" ]; then
            echo "Tag ${TAG} exists on remote at ${REMOTE_TAG_SHA}, but HEAD is at ${HEAD_SHA}. Re-pointing tag..."
            echo "should_release=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}" --force
          elif [ -z "$REMOTE_TAG_SHA" ]; then
            echo "Tag ${TAG} does not exist yet. Creating and pushing tag ${TAG}..."
            echo "should_release=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          elif [ "$FORCE" = "true" ] || [ "$IS_MANUAL" = "true" ]; then
            echo "Manual or forced release requested for ${TAG}. Re-pointing tag..."
            echo "should_release=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -fa "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}" --force
          else
            echo "Tag ${TAG} already exists at current commit ${HEAD_SHA}. Skipping duplicate release build."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  release:
    name: Build & Upload Desktop Bundles (macOS)
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/desktop/src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -w -r --filter '!packages/desktop' run build

      - name: Bundle desktop embedded server
        run: pnpm run desktop:bundle-server

      - name: Build and bundle Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          RUST_BACKTRACE: "1"
        with:
          projectPath: packages/desktop
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: 'SP Kickstack ${{ needs.prepare.outputs.tag_name }}'
          releaseBody: |
            ## SP Kickstack Desktop App ${{ needs.prepare.outputs.tag_name }}

            ### 🚀 Quick Install (macOS)
            Run this one-line command in Terminal to download, install, and open with zero warnings:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/sopheaksem9999/sp-kickstack/main/scripts/install-mac.sh | bash
            ```

            ### 📦 Manual Download
            - **macOS**: `.dmg` installer asset below.

            > **First-time DMG Users**: If macOS shows *"is damaged and can't be opened"*, clear the quarantine flag in Terminal:
            > ```bash
            > xattr -cr /Applications/"SP Kickstack.app"
            > ```
            > Or click **Open Anyway** in **System Settings > Privacy & Security**.

            *(Windows and Linux installers will be available in an upcoming update)*
          releaseDraft: true
          prerelease: false
          args: '--bundles dmg'

  publish:
    name: Publish Release
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          echo "Publishing release for ${TAG_NAME}..."
          gh release edit "${TAG_NAME}" --draft=false
