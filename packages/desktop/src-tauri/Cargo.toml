[package]
name = "sp-kickstack"
version = "0.3.4"
description = "SP Kickstack AI Studio Bridge Desktop"
authors = ["Sopheak Sem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
